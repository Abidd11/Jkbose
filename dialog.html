<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JKBose Helper - Educational Quote</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            padding: 16px;
            overflow: hidden;
        }

        /* Asymmetric Bubble Design Framework */
        .dialog {
            max-width: 320px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px 40px 8px 40px;
            padding: 28px 24px 20px 24px;
            position: relative;
            box-shadow: 0 30px 70px -10px rgba(79, 70, 229, 0.25);
            border: 4px solid #4F46E5;
            text-align: center;
            transform-origin: bottom left;
            animation: popIn 0.6s cubic-bezier(0.34, 1.76, 0.64, 1) forwards;
            transition: all 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.5) rotate(-8deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .dialog.exit-animation {
            animation: popOut 0.3s cubic-bezier(0.36, -0.07, 0.57, -0.2) forwards;
        }

        @keyframes popOut {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.7) translateY(30px); opacity: 0; }
        }

        /* Mascot Container */
        .avatar-container {
            width: 86px;
            height: 86px;
            margin: -58px auto 14px;
            position: relative;
            background: #4F46E5;
            border-radius: 30px;
            padding: 4px;
            box-shadow: 0 12px 24px -6px rgba(79, 70, 229, 0.4);
            animation: gentleSwing 4s ease-in-out infinite;
        }

        @keyframes gentleSwing {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-5px) rotate(3deg); }
        }

        .teddy-bear {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #ffffff;
            border-radius: 26px;
        }

        /* Content Card */
        .notice-canvas {
            background: #F8FAFC;
            border-radius: 24px;
            padding: 20px 16px;
            margin-bottom: 20px;
            border: 1px dashed #CBD5E1;
            position: relative;
        }

        .notice-title {
            font-size: 14px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .notice-title .accent-dot {
            width: 6px;
            height: 6px;
            background: #4F46E5;
            border-radius: 50%;
        }

        .notice-content {
            font-size: 13px;
            color: #334155;
            line-height: 1.6;
            font-weight: 600;
            text-align: center;
            font-style: italic;
        }

        .notice-highlight {
            color: #4F46E5;
            font-weight: 800;
            margin-top: 8px;
            display: block;
            font-style: normal;
            font-size: 12px;
        }

        /* Primary Action Button (Dismiss) */
        .action-btn { 
            background: #0f172a;
            color: #ffffff; 
            padding: 16px 20px; 
            border-radius: 20px; 
            border: none; 
            font-size: 14px; 
            font-weight: 800; 
            width: 100%; 
            cursor: pointer; 
            margin-bottom: 14px;
            letter-spacing: 0.3px;
            box-shadow: 0 10px 25px -6px rgba(15, 23, 42, 0.3);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: #1e293b;
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -4px rgba(15, 23, 42, 0.4);
        }

        .action-btn:active { 
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="dialog" id="dialog">
        <!-- Floating Mascot Wrapper -->
        <div class="avatar-container">
            <img src="https://media.tenor.com/-aW73OVUtyYAAAAi/tkthao219-bubududu.gif" alt="Mascot" class="teddy-bear">
        </div>
        
        <!-- Notice Canvas -->
        <div class="notice-canvas">
            <div class="notice-title">
                <span class="accent-dot"></span>
                Daily Inspiration
                <span class="accent-dot"></span>
            </div>
            <div class="notice-content" id="quoteText">
                "Loading daily wisdom..."
            </div>
            <span class="notice-highlight" id="quoteAuthor">— Author</span>
        </div>

        <!-- Primary Action Button -->
        <button class="action-btn" onclick="handleClose()">
            <span>✨</span> Got It
        </button>
    </div>

    <script>
        const educationalQuotes = [
            { quote: "Education is the most powerful weapon which you can use to change the world.", author: "Nelson Mandela" },
            { quote: "The beautiful thing about learning is that no one can take it away from you.", author: "B.B. King" },
            { quote: "Live as if you were to die tomorrow. Learn as if you were to live forever.", author: "Mahatma Gandhi" },
            { quote: "An investment in knowledge pays the best interest.", author: "Benjamin Franklin" },
            { quote: "The roots of education are bitter, but the fruit is sweet.", author: "Aristotle" },
            { quote: "Education is not preparation for life; education is life itself.", author: "John Dewey" },
            { quote: "Change is the end result of all true learning.", author: "Leo Buscaglia" },
            { quote: "Tell me and I forget. Teach me and I remember. Involve me and I learn.", author: "Benjamin Franklin" },
            { quote: "The mind is not a vessel to be filled, but a fire to be kindled.", author: "Plutarch" },
            { quote: "Learning never exhausts the mind.", author: "Leonardo da Vinci" }
        ];

        function displayRandomQuote() {
            const randomIndex = Math.floor(Math.random() * educationalQuotes.length);
            const selected = educationalQuotes[randomIndex];
            document.getElementById('quoteText').innerText = `"${selected.quote}"`;
            document.getElementById('quoteAuthor').innerText = `— ${selected.author}`;
        }

        function handleClose() { 
            const dialog = document.getElementById('dialog');
            dialog.classList.add('exit-animation');
            setTimeout(() => {
                dialog.style.display = 'none';
            }, 300);
        }

        // Load a quote every time the dialog is opened/loaded
        window.onload = function() {
            displayRandomQuote();
        };
    </script>
</body>
</html>
